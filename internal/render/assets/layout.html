{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.CSSHref}}">
</head>
<body>
<header class="site-header">
<a class="site-title" href="{{.HomeHref}}">Wishlist</a>
</header>
<main>
{{end}}

{{define "card"}}<article class="card">
<h3 class="card-title"><a href="{{.URL}}">{{.Title}}</a></h3>
<p class="card-store"><a href="{{.StoreHref}}">{{.StoreLabel}}</a></p>
{{if .Variant}}<p class="card-variant">{{.Variant}}</p>
{{end}}{{if .Price}}<p class="card-price">{{.Price}}</p>
{{end}}{{if .Archived}}<p class="card-archived">archived</p>
{{end}}</article>{{end}}

{{define "footer"}}</main>
<footer class="site-footer">
<p>Generated from Linkding bookmarks tagged <code>{{.Tag}}</code>.</p>
</footer>
</body>
</html>
{{end}}
