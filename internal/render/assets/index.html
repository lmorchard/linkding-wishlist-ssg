{{define "index"}}{{template "head" .}}
<h1>{{.Heading}}</h1>
{{if .Facets}}<nav class="facets">
<h2>Facets</h2>
<ul>
{{range .Facets}}<li><a href="{{.Href}}">{{.Name}}</a></li>
{{end}}</ul>
</nav>
{{end}}<nav class="views">
<a href="{{.StoresHref}}">All stores</a>
{{if .Years}}<span class="views-label">Archive</span>
{{range .Years}}<a href="{{.Href}}">{{.Label}}</a>
{{end}}{{end}}</nav>
{{template "days" .}}
{{template "footer" .}}{{end}}
